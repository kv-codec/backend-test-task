name: HTTP Tests

on:
    pull_request:
        branches:
            - main

jobs:
    test-http:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - uses: jdx/mise-action@v4
              with:
                  cache: true

            - name: Set USER_ID
              run: echo "UID=$(id -u)" >> $GITHUB_ENV

            - name: Run HTTP tests
              env:
                  USER_ID: ${{ env.UID }}
              run: mise run test-http
